name: publish

# Keyless publish to npm via Trusted Publishing (OIDC). No npm token or secret
# is stored — npm trusts this specific workflow. Requires the package to have a
# Trusted Publisher configured on npmjs.com (GitHub Actions: kmike/pi-output-limits,
# workflow filename publish.yml). Driven by `npm version patch && git push
# --follow-tags`.
#
# The package must exist before a trusted publisher can be attached to it, so
# the FIRST publish is done locally (npm publish, OTP), then all subsequent
# releases go through this workflow keylessly.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  id-token: write   # OIDC: lets npm verify this exact workflow published it

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org   # npm auto-detects OIDC here

      - name: Verify tag matches package.json version
        run: |
          node -e "\
          const {readFileSync} = require('fs');\
          const {version} = JSON.parse(readFileSync('./package.json', 'utf8'));\
          const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');\
          if (version !== tag) {\
            console.error('Tag v'+tag+' does not match package.json version '+version);\
            process.exit(1);\
          }"

      # Trusted publishing requires npm >= 11.5.1; node 24 ships 11.x, bump to be safe.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - run: npm test

      - run: npm publish --provenance --access public
